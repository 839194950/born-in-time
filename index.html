<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>生逢其时 · 只抽出生年份的人生模拟</title>
    <meta
      name="description"
      content="只抽出生年份的人生模拟。1958 到 2005，抽到哪一年，就过哪一年的人生。"
    />
    <meta name="theme-color" content="#f6f0e4" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://born-in-time.pages.dev/" />

    <!--
      分享卡：微信不读 og（要走公众号 JS-SDK），但浏览器、微博、Telegram 等渠道全靠它。
      注意 og:image / og:url 必须是**绝对地址**——抓取器不会替你解析相对路径，
      写 /og.png 的结果是分享卡上一片空白。
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="生逢其时" />
    <meta property="og:url" content="https://born-in-time.pages.dev/" />
    <meta property="og:title" content="生逢其时 · 只抽出生年份的人生模拟" />
    <meta
      property="og:description"
      content="抽到哪一年，就过哪一年的人生。赶上、差一年、路过——你属于哪一种。"
    />
    <meta property="og:image" content="https://born-in-time.pages.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="生逢其时：只抽出生年份的人生模拟" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="生逢其时 · 只抽出生年份的人生模拟" />
    <meta
      name="twitter:description"
      content="抽到哪一年，就过哪一年的人生。赶上、差一年、路过——你属于哪一种。"
    />
    <meta name="twitter:image" content="https://born-in-time.pages.dev/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
